# Deploy workflow — triggers only on push to main (i.e., merged PRs).
# Why: CI workflow runs the full check suite on every PR; deploy only fires after CI
#      has already passed on main. Separating concerns keeps deploy fast and avoids
#      deploying from a non-main branch.
#
# wrangler-action@v3 inputs verified via context7 /cloudflare/wrangler-action README
# (2026-04-25): apiToken, accountId, command are the correct input keys.
# Token scope required: Workers Scripts:Edit + Account:Read.
# Source: developers.cloudflare.com/workers/wrangler/ci-cd/
#
# `command: deploy --config packages/site/wrangler.jsonc` uses the monorepo-relative
# path so wrangler picks up the site's wrangler.jsonc from the workspace root.
# Verified pattern: context7 /cloudflare/wrangler-action multi-project example.
#
# actionlint-clean: verified via /home/vboxuser/.local/bin/actionlint, exit 0.
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Why: the denylist is a secret; --require-denylist below fails the deploy if it is missing (ADR 0055).
    env:
      PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      # Node required for @lhci/cli — included for parity with CI workflow so that
      # the environment is reproducible. Not strictly needed for deploy itself.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run --cwd packages/site build
        env:
          UTOFME_FIXTURES: "false"

      # Guard — fails the deploy if any fixture work leaked into dist/ (P9-3).
      - name: Guard — no fixtures in dist
        run: bun run --cwd packages/site check:no-fixtures

      # Guard — privacy scan of the built site; any hit or a missing secret fails the deploy (P10-3).
      - name: Guard — privacy scan of dist
        run: bun run --cwd packages/site check:privacy --dist dist --require-denylist

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Why: run inside packages/site so the action finds the pinned wrangler 4.x there; from the
          # repo root it found none and installed its default 3.90, which ignores
          # `assets.run_worker_first`, so /loops/* never reached the range Worker (no 206 for Safari).
          workingDirectory: packages/site
          command: deploy --config wrangler.jsonc

      # Smoke probe — verifies /feed.xml returns 200 after Cloudflare deploy.
      # Why: LHCI removed /feed.xml from its URL list (non-HTML); this curl probe
      # is the lightweight replacement to catch feed regressions. See GH #87.
      # Retries 3× with 2s backoff to allow Cloudflare edge to warm after deploy.
      - name: Smoke — feed.xml 200 probe
        # Why: utof.me has no DNS yet (2026-11-04); the site is tested on its workers.dev URL.
        # Warn-only until the custom domain is attached, so a missing domain doesn't fail deploys.
        continue-on-error: true
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error -o /dev/null https://utof.me/feed.xml; then
              echo "✓ /feed.xml returned 200 (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt failed; sleeping 2s..."
            sleep 2
          done
          echo "ERROR: /feed.xml did not return 200 after 3 attempts" >&2
          exit 1

      # Range probe — a Range request on a /loops/ file must return 206 (P9-5, D15).
      # WARN-ONLY: never fails the deploy (the domain may not be live yet, and no loop
      # may be published yet). Emits a GitHub ::warning:: annotation instead.
      - name: Probe — /loops Range 206 (warn-only)
        continue-on-error: true
        run: |
          manifest=packages/site/src/data/loops.json
          if [ ! -f "$manifest" ]; then echo "::warning::no loops manifest yet; skipping Range probe"; exit 0; fi
          path=$(grep -o '/loops/[^"]*\.mp4' "$manifest" | head -n 1 || true)
          if [ -z "$path" ]; then echo "::warning::no /loops/ URL in manifest; skipping Range probe"; exit 0; fi
          sleep 5
          out=$(curl --silent --show-error -o /dev/null -D - -H 'Range: bytes=0-1' "https://utof.me$path" || true)
          if echo "$out" | head -n 1 | grep -q ' 206' && echo "$out" | grep -qi '^content-range: bytes 0-1/'; then
            echo "✓ $path returned 206 with Content-Range"
          else
            echo "::warning::Range probe on $path did not return 206 (warn-only; domain may not be live)"
            echo "$out"
          fi

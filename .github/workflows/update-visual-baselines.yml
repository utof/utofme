# Regenerate Playwright visual-regression baselines on a GitHub runner.
#
# Why: the baselines (`packages/site/tests/e2e/*-snapshots/*.png`) depend on the real
# Google Fonts, which the agent VM cannot fetch, so they must be rendered here. This
# job runs the SAME suite as the CI `test:e2e` step (same `bun run test:e2e` script, same
# `chromium-mobile` project from playwright.config.ts, same
# `npx playwright install --with-deps chromium`) with `--update-snapshots`, then commits
# the changed PNGs back to the chosen branch.
#
# Note: commits pushed with the default GITHUB_TOKEN do not trigger other workflows;
# re-run CI from the Actions tab (or push any follow-up commit) to get a CI run on the
# regenerated baselines.
#
# Sources:
#   https://playwright.dev/docs/test-snapshots (--update-snapshots)
#   https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
name: Update visual baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to regenerate baselines on (the commit is pushed to it)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same build as the CI job (default env: fixtures visible, as the e2e suite expects).
      - name: build
        run: bun run --cwd packages/site build

      - name: Install Playwright browsers
        run: cd packages/site && npx playwright install --with-deps chromium

      # `--update-snapshots` rewrites only snapshots that differ. Functional failures
      # (non-screenshot assertions) must not block regeneration, hence `|| true`; the
      # normal CI run still gates them.
      - name: test:e2e (update snapshots)
        run: bun run --cwd packages/site test:e2e --update-snapshots || true

      - name: Commit regenerated baselines
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'packages/site/tests/e2e/*-snapshots/*.png'
          if git diff --cached --quiet; then
            echo "No baseline changes."
            exit 0
          fi
          git commit -m "test: regenerate visual baselines"
          git push origin "HEAD:refs/heads/${BRANCH}"

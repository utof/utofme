# CI workflow — runs on every PR targeting main and every push to main.
# Why: validates the full check:* chain + tests + build + size gates + Lighthouse
#      before any merge to main. Matches the lefthook pre-commit order per
#      packages/specs/specs/00-foundations.md § "Lefthook ordering requirement".
#
# setup-bun@v2 inputs verified via context7 /oven-sh/setup-bun (README, 2026-04-25):
#   bun-version accepts semver prefix e.g. '1.3' (resolves to latest 1.3.x).
#   No `cache:` input — the action handles caching internally via bun-version key.
# setup-node@v4 is required because @lhci/cli spawns a Node host; running
#   `npx lhci autorun` under Bun's npx shim can fail on Node-native modules.
#   Source: packages/specs/specs/00-foundations.md § "Success criteria" (LHCI line).
# wrangler (installed as a dev dep) is NOT invoked here; preview uses astro preview,
#   not wrangler dev, to avoid needing CF credentials in CI.
#
# actionlint-clean: verified via `npx -y actionlint .github/workflows/ci.yml`.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      # Node is required for @lhci/cli (spawns Node) and `npx playwright install`.
      # Source: packages/specs/specs/00-foundations.md § "Success criteria" LHCI note.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Webmentions sync (Phase 6 Task 11) ────────────────────────────────────
      # Why: fetch indieweb mentions from webmention.io BEFORE build so the JSON
      # snapshot is current when Webmentions.astro reads it via import.meta.glob.
      # Runs separately from `bun run build` for rate-limit hygiene + offline-
      # friendly local dev. continue-on-error:true because webmention.io transient
      # outages or rate-limits should not break the build — the script returns 0
      # even on partial fetch (commits last-known-good JSON), and the `|| echo`
      # belt-and-suspenders covers any non-zero exit. Placed AFTER install +
      # BEFORE check:biome so the JSON is in place for all downstream steps.
      #
      # Why the secret gate: until the user provisions a webmention.io account
      # for utof.me, every target returns 0 mentions and the script's orphan-
      # deletion phase wipes committed test fixtures (e.g. welcome.json) — which
      # then breaks the webmentions e2e. Skip the step entirely until the secret
      # exists; once set, sync runs end-to-end. See progress.md user-only queue.
      # See: packages/specs/plans/06-indieweb.md § Task 11
      - name: sync:webmentions
        if: env.WEBMENTION_IO_TOKEN != ''
        env:
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}
        working-directory: packages/site
        run: |
          bun run sync:webmentions || echo "[webmentions] non-fatal sync issue; using last-known-good"
        continue-on-error: true

      # ── Linting & static analysis ──────────────────────────────────────────────
      - name: check:biome
        run: bun run --cwd packages/site check:biome

      - name: check:prettier
        run: bun run --cwd packages/site check:prettier

      - name: check:astro
        run: bun run --cwd packages/site check:astro

      - name: check:type-coverage
        run: bun run --cwd packages/site check:type-coverage

      - name: check:knip
        run: bun run --cwd packages/site check:knip

      - name: check:depcruise
        run: bun run --cwd packages/site check:depcruise

      - name: check:docs
        run: bun run --cwd packages/site check:docs

      # ── Build (must precede vitest AND e2e) ────────────────────────────────────
      #    vitest's tests/unit/card-pagefind-attrs.test.ts reads dist/index.html for
      #    the Pagefind attribute snapshot test (Astro Container API can't render
      #    components with dynamic Tag bindings, so build-output is the oracle).
      #    Playwright's webServer runs `astro preview` which fails fast if dist/
      #    is missing. Source: packages/specs/plans/02-interactivity.md Task 8.
      - name: build
        run: bun run --cwd packages/site build

      # ── Unit tests (depend on dist/ from the build step above) ─────────────────
      - name: test (vitest)
        run: bun run --cwd packages/site test

      # ── Post-build static gates (run before e2e so a build / budget regression
      #    aborts the run before browsers spin up) ────────────────────────────────
      - name: check:size (size-limit)
        run: bun run --cwd packages/site check:size

      # ── Playwright e2e (uses dist/ via `astro preview`) ────────────────────────
      - name: Install Playwright browsers
        run: cd packages/site && npx playwright install --with-deps chromium

      - name: test:e2e (playwright)
        run: bun run --cwd packages/site test:e2e

      # ── Lighthouse CI ──────────────────────────────────────────────────────────
      # Invoked via npx (Node host) not bunx — @lhci/cli requires Node internals.
      # Source: packages/specs/specs/00-foundations.md § "Success criteria" LHCI note.
      - name: Lighthouse CI
        run: cd packages/site && npx @lhci/cli autorun
